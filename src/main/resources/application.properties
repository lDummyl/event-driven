spring.application.name=event-driven

# --- state store: in-memory H2, rebuilt from the log on every startup ---
spring.datasource.url=jdbc:h2:mem:state;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# --- eternal event log (append-only NDJSON file) ---
app.log.path=./data/event-log.ndjson
# true  -> the service fully wipes the log on startup (fresh history)
# false -> the existing log is loaded and state is rebuilt from it
app.log.wipe-on-start=true

# --- current rating rule: points awarded per 100 donated ---
# old rule was 200, change to 50 and restart/rebuild to see a full recalculation
app.rating.points-per-100=200
